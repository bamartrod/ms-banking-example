server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:oracle:thin:@//oracle:1521/FREEPDB1}
    username: ${DATABASE_USERNAME:${ORACLE_USER:monolith}}
    password: ${DATABASE_PASSWORD:${ORACLE_PASSWORD:changeit}}
    driver-class-name: ${DATABASE_DRIVER:oracle.jdbc.OracleDriver}
  jpa:
    hibernate.ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate.dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.OracleDialect}
  jackson:
    # Boot 4 + Jackson 3: WRITE_DATES_AS_TIMESTAMPS removed from SerializationFeature
    # (moved to DateTimeFeature). Disable via mapper config rather than serialization map.
    # Keep default (false is Jackson 3 default). Override via application-test if needed.
    serialization.indent-output: false

management:
  endpoints.web.exposure.include: ${MANAGEMENT_ENDPOINTS:health,info}
  observations.key-values.application: ${APP_NAME:monolith}

logging:
  level.com.bamartrod: ${LOG_LEVEL:INFO}
